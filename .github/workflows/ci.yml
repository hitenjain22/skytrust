name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (all offline, incl. app smoke tests) with coverage
        run: |
          set -o pipefail
          uv run pytest -m "not network" --cov --cov-report=term-missing -rfE 2>&1 | tee pytest.log
      # Failing tests become annotations, shown on the run's summary page (and readable through
      # the public API) without opening the full log.
      - name: Report failing tests
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | sed 's/^/::error title=Test failed::/' || true
          grep -E "^E  " pytest.log | head -30 | sed 's/^/::warning title=Assertion::/' || true
