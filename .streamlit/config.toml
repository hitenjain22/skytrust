[theme]
# "Observatory": a calm monochrome system. Soft graphite / paper instead of pure black / white,
# colour only where it carries meaning. Light and dark follow the viewer's system setting.
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap, sans-serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"
headingFontWeights = [500, 500, 500, 500, 500, 500]
headingFontSizes = ["2.25rem", "1.5rem", "1.2rem", "1.05rem", "1rem", "0.9rem"]
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
metricValueFontWeight = 400

[theme.dark]
backgroundColor = "#141416"
secondaryBackgroundColor = "#1C1C1F"
textColor = "#DCDCE0"
primaryColor = "#DCDCE0"
linkColor = "#DCDCE0"
borderColor = "#2A2A2E"
codeBackgroundColor = "#1C1C1F"

[theme.light]
backgroundColor = "#F6F6F4"
secondaryBackgroundColor = "#ECECE9"
textColor = "#232326"
primaryColor = "#232326"
linkColor = "#232326"
borderColor = "#DEDEDA"
codeBackgroundColor = "#ECECE9"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Visitors see a clean app: no developer "Deploy" button or dev menu.
toolbarMode = "viewer"
