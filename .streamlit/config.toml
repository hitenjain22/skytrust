[theme]
# "Nightfall": deep night-blue instead of black, warm starlight gold as the one accent, a serif
# for headings (Instrument Serif) over a clean sans for everything else (Geist). Light and dark
# follow the viewer's system setting.
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap, sans-serif"
headingFont = "Instrument Serif:https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap, Georgia, serif"
codeFont = "Geist Mono:https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"
headingFontWeights = [400, 400, 400, 400, 400, 400]
headingFontSizes = ["2.6rem", "1.9rem", "1.45rem", "1.2rem", "1.05rem", "0.95rem"]
baseRadius = "0.75rem"
buttonRadius = "999px"
showWidgetBorder = true
metricValueFontWeight = 400

[theme.dark]
backgroundColor = "#0A0F1C"
secondaryBackgroundColor = "#131B2C"
textColor = "#E8EBF2"
primaryColor = "#E6BE74"
linkColor = "#EBCB8B"
borderColor = "#1F2A40"
codeBackgroundColor = "#131B2C"

[theme.light]
backgroundColor = "#F6F4EE"
secondaryBackgroundColor = "#ECE8DE"
textColor = "#18202F"
primaryColor = "#9A6A1E"
linkColor = "#8A5D14"
borderColor = "#DCD6C8"
codeBackgroundColor = "#ECE8DE"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Visitors see a clean app: no developer "Deploy" button or dev menu.
toolbarMode = "viewer"
