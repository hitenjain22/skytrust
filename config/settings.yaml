# SkyTrust settings. Definitions here are the source of truth (SPEC.md Section 4).
# Changing any value in `definitions` or `split` requires Hiten's approval.

definitions:
  clear_threshold: 0.20        # hour is clear if cloud fraction <= this (0-1 scale)
  min_run_hours: 3             # usable night = >= this many consecutive clear dark hours
  sun_altitude_deg: -18.0      # astronomical twilight
  max_missing_frac: 0.25       # nights/features with more missing dark hours are excluded / NaN
  display_timezone: America/Los_Angeles
  # METAR sky-cover code -> cloud fraction (okta midpoints). VV = sky obscured.
  sky_cover_mapping:
    default: {CLR: 0.0, SKC: 0.0, NCD: 0.0, NSC: 0.0, FEW: 0.1875, SCT: 0.4375, BKN: 0.75, OVC: 1.0, VV: 1.0}
    conservative: {CLR: 0.0, SKC: 0.0, NCD: 0.0, NSC: 0.0, FEW: 0.25, SCT: 0.4375, BKN: 0.75, OVC: 1.0, VV: 1.0}
  sky_cover_mode: default
  # How to turn the reports in an hour's window into one value (DECISIONS 2026-09-25).
  # nearest = report closest to the top of the hour (ties -> cloudier); max = SPEC's original rule.
  asos_hour_aggregation: nearest

split:
  train_start: 2024-01-01
  train_end: 2025-12-31
  test_start: 2026-01-01
  # Frozen end of the evaluation period (2026-09-29) so every rerun reproduces the same numbers.
  # Must be a date whose data is final: ERA5 publishes ~6 days late, so stay >= 2 weeks back.
  # To refresh the track record: move this date, run `make all`, commit the new results.
  test_end: 2026-08-31
  cv_folds: 4

# Forecast models, verified by probing the Previous Runs API (see docs/DATA_NOTES.md).
# Approved by Hiten at the Phase 0 checkpoint (2026-09-25).
models:
  - {short: gfs, id: gfs_global, name: NCEP GFS (0.11-0.25 deg), leads: [1, 2, 3, 4, 5, 6, 7]}
  - {short: hrrr, id: ncep_hrrr_conus, name: NCEP HRRR CONUS (3 km), leads: [1]}
  - {short: ecmwf, id: ecmwf_ifs025, name: ECMWF IFS 0.25 deg, leads: [1, 2, 3, 4, 5, 6, 7]}
  - {short: gem, id: gem_seamless, name: CMC GEM, leads: [1, 2, 3, 4, 5, 6, 7]}
  - {short: icon, id: icon_seamless, name: DWD ICON, leads: [1, 2, 3, 4, 5, 6]}

# Benchmarks: scored against the blend but never used inside the shipped blend (so the live
# forward test keeps evaluating one fixed model). NBM = NOAA's own statistical blend of models;
# its Previous Runs archive starts 2024-10-09 (DATA_NOTES).
benchmark_models:
  - {short: nbm, id: ncep_nbm_conus, name: NOAA National Blend of Models (2.5 km), leads: [1, 2, 3, 4, 5, 6, 7]}

leads: [1, 2, 3, 4, 5, 6, 7]

astro:
  moon_up_altitude_deg: 0.0      # Moon counts as "up" when its centre is above the horizon

sources:
  prevruns_url: https://previous-runs-api.open-meteo.com/v1/forecast
  era5_url: https://archive-api.open-meteo.com/v1/archive
  era5_model: era5               # must be explicit: the default "best_match" mixes in IFS HRES
  forecast_url: https://api.open-meteo.com/v1/forecast
  iem_asos_url: https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py
  iem_network_url: https://mesonet.agron.iastate.edu/geojson/network/{network}.geojson
  iem_network: CA_ASOS
  iem_report_types: [3, 4]       # routine + SPECI only; excludes 5-minute MADIS HFMETAR rows
  history_start: 2024-01-01
  era5_lag_days: 8               # measured ~6 days (DATA_NOTES); 8 leaves margin so fetched chunks are complete
  settled_after_days: 30         # chunks older than this are cached even with nulls (nulls are permanent)
  complete_lag_days: 2           # last night considered complete = today (UTC) - this

http:
  timeout_s: 30
  max_attempts: 5
  backoff_base_s: 2.0
  polite_delay_s: 1.0
  user_agent: "SkyTrust/0.1 (student portfolio project; https://github.com/hitenjain22/skytrust)"

site_validation:
  # Candidate sites (SPEC 5). Coordinates/elevation are NOT typed here; they come from IEM.
  candidates:
    - {id: SAC, terrain_class: Central Valley floor}
    - {id: FAT, terrain_class: San Joaquin Valley floor}
    - {id: AUN, terrain_class: Sierra foothills}
    - {id: TRK, terrain_class: High Sierra}
    - {id: BIH, terrain_class: Eastern Sierra / Owens Valley}
  min_night_coverage: 0.85
  # Phase 0 proxy for "night hours" (real dark hours come from astro.py in Phase 1):
  # local hours 23:00-03:00 are inside astronomical darkness year-round at CA latitudes
  # (June solstice at TRK: dusk ~22:35 PDT, dawn ~03:50 PDT).
  proxy_night_local_hours: [23, 0, 1, 2, 3]

verdict:
  go: 0.70
  maybe: 0.40

live:
  # "Models split" if tonight's spread exceeds this quantile of the training-period spread.
  agreement_quantile: 0.75
  # Trust level shown in the 7-night outlook, from the blend's test BSS at that lead.
  trust_bss: {high: 0.5, medium: 0.3}
  forecast_days: 8
  cache_ttl_minutes: 60
decision_threshold: 0.5

modeling:
  # Logistic-regression C searched on log10 scale: np.logspace(start, stop, num)
  c_grid_log10: [-3, 3, 13]
  # CV log losses within this of the best are treated as ties; the most regularized C wins.
  cv_tie_tolerance: 1.0e-4

forward:
  # Prospective verification: forecasts are logged daily *before* the outcome exists, then scored
  # once observations arrive. Nights issued on/after start_date were never seen during development.
  start_date: 2026-09-30
  ensemble_models: [ecmwf_ifs025, gfs025]     # raw ensembles -> P(usable) = share of members
  ensemble_url: https://ensemble-api.open-meteo.com/v1/ensemble
  verify_after_days: 9                         # ERA5 lag (~6 days) + margin before scoring a night
  summary_url: https://raw.githubusercontent.com/hitenjain22/skytrust/forward-data/summary.json

climatology:
  # Long-term reference for skill scores (WMO practice), entirely before training and test.
  start: 2004-01-01
  end: 2023-12-31
  min_year_coverage: 0.8        # keep a station-year only if >= 80% of its nights are labeled

walkforward:
  # Rolling-origin evaluation: from this month on, refit every month on all earlier nights.
  start: 2025-01-01

calibration:
  # Apply isotonic calibration to a blend only if its out-of-fold expected calibration error
  # (10 bins, training folds only) exceeds this. Logistic regression is usually calibrated already.
  ece_threshold: 0.05

seed: 20260101
bootstrap_resamples: 1000
# A bootstrap CI needs enough independent blocks; subsets spanning fewer weeks get no CI.
min_weeks_for_ci: 8

light_pollution:
  # World Atlas of Artificial Night Sky Brightness (Falchi et al. 2016, Science Advances 2:e1600377;
  # data doi:10.5880/GFZ.1.4.2016.001, CC BY-NC 4.0). Artificial zenith brightness, 30" grid.
  atlas_url: https://datapub.gfz.de/download/10.5880.GFZ.1.4.2016.001/World_Atlas_2015.zip
  # Same region as custom locations (live.CUSTOM_BOUNDS).
  bounds: {lat: [32.0, 49.0], lon: [-125.0, -114.0]}
  natural_ucd: 174.0          # paper: natural background 22.0 mag/arcsec2 = 174 ucd/m2
  natural_sqm: 22.0
  sigma_sqm: 0.15             # paper: model vs SQM measurements, standard deviation (mag/arcsec2)
  radii_km: [25, 50, 100]     # "darkest sky within ..." search radii
  dark_bortle: 4              # counted as a dark site in the "3 conditions" check
