# One or two sentences about each object the Sky Guide can list, shown when it's tapped.
# Well-established facts only (names, myths, distances, discoveries), as found in standard
# references (NASA, ESA, the IAU, Burnham's Celestial Handbook). Keep each under ~40 words.
facts:
  # the Moon and planets
  Moon: "About 384,000 km away, the Moon always turns the same face to us. Its dark patches are old lava plains that early astronomers took for seas."
  Mercury: "The closest planet to the Sun: a year there lasts just 88 days. It never strays far from the Sun, so look for it low in twilight."
  Venus: "The brightest planet, wrapped in thick clouds that trap heat: at about 460 °C it's the hottest planet, hotter than Mercury."
  Mars: "Red because its dust is rich in iron oxide, or rust. It has the tallest volcano in the solar system, Olympus Mons."
  Jupiter: "The largest planet. Binoculars show its four biggest moons as tiny dots in a line, the same moons Galileo discovered in 1610."
  Saturn: "Its rings are made mostly of chunks of water ice. Even a small telescope shows them."
  Uranus: "The first planet found with a telescope, by William Herschel in 1781. It's right at the limit of the naked eye under a dark sky."
  # bright stars
  Sirius: "The brightest star in the night sky, just 8.6 light-years away. It's the Dog Star, in Canis Major, the Big Dog."
  Canopus: "The second-brightest star in the sky. It's so far south that from Southern California it only just clears the horizon, and from the north of the state it never rises."
  Arcturus: "The brightest star in the northern half of the sky. Follow the curve of the Big Dipper's handle: “arc to Arcturus.”"
  Vega: "Earth's axis slowly wobbles, so the North Star changes over time: Vega was the pole star around 12,000 BC and will be again in about 12,000 years."
  Capella: "Looks like one yellow star but is two pairs of stars: two giant suns close together, plus a faint pair farther out."
  Rigel: "A blue supergiant marking Orion's foot; its name comes from the Arabic for “foot.”"
  Procyon: "Its name means “before the dog”: it rises just before Sirius, the Dog Star."
  Betelgeuse: "A red supergiant so big that, in place of the Sun, it would reach past the orbit of Mars. It dimmed dramatically in 2019-2020."
  Achernar: "Its name means “end of the river” (the long constellation Eridanus). It spins so fast it's one of the flattest stars known."
  Altair: "It spins once every nine hours or so, so fast that it bulges at its equator. One corner of the Summer Triangle."
  Aldebaran: "The red eye of Taurus, the Bull. Its name means “the follower”: it follows the Pleiades across the sky."
  Antares: "Its name means “rival of Mars,” for its red color. A red supergiant at the heart of Scorpius."
  Spica: "The brightest star in Virgo, actually two hot stars orbiting each other every four days."
  Pollux: "The brighter of the Gemini twins, an orange giant with a planet of its own, found in 2006."
  Castor: "Looks like one star but is six: three pairs of stars orbiting each other."
  Fomalhaut: "The lonely bright star of autumn evenings; its name means “mouth of the fish.” It's ringed by a wide disk of dust."
  Deneb: "Very far away for such a bright star, roughly 2,600 light-years, so it must be one of the most luminous stars you can see."
  Regulus: "The heart of Leo. It sits almost on the Sun's path, so the Moon sometimes passes right in front of it."
  Adhara: "The second-brightest star in Canis Major. About 4.7 million years ago it was the brightest star in Earth's sky."
  Acrux: "The brightest star of the Southern Cross. It never rises above the horizon from California."
  Gacrux: "The red star at the top of the Southern Cross, the nearest red giant to the Sun."
  Mimosa: "One of the four bright stars of the Southern Cross, never visible from California."
  Hadar: "With Alpha Centauri, it points the way to the Southern Cross. It never rises above the horizon from California."
  Toliman: "Alpha Centauri, the nearest star system to the Sun, 4.4 light-years away. It never rises from California."
  # clusters, galaxies, nebulae
  Pleiades: "The Seven Sisters: a young family of stars about 100 million years old. Japan calls them Subaru, and the carmaker's logo shows them."
  Hyades: "The nearest star cluster to us, about 150 light-years away: the V-shaped face of Taurus (bright Aldebaran isn't a member)."
  Alpha Persei Cluster: "A loose group of stars around Mirfak, the brightest star of Perseus. Lovely in binoculars."
  Coma Star Cluster: "Named for Queen Berenice's hair: in legend her locks were placed among the stars."
  Beehive Cluster: "Also called Praesepe, “the manger.” Galileo turned his telescope on it and counted about 40 stars."
  Ptolemy's Cluster: "Described by the astronomer Ptolemy around AD 130, one of the first star clusters ever recorded."
  Butterfly Cluster: "Its brightest stars outline the shape of a butterfly with open wings, best seen in binoculars."
  Double Cluster: "Two star clusters side by side, about 7,500 light-years away, each with hundreds of stars."
  Andromeda Galaxy: "A spiral galaxy of about a trillion stars, 2.5 million light-years away. It's heading toward our Milky Way and will merge with it in about 4-5 billion years."
  Triangulum Galaxy: "A spiral galaxy about 3 million light-years away, one of the most distant things the eye can see, and only from very dark skies."
  Orion Nebula: "A cloud of gas where new stars are being born right now, about 1,300 light-years away."
  Lagoon Nebula: "A glowing cloud of gas in Sagittarius where new stars are forming, split by a dark lane like a lagoon."
  Hercules Cluster: "A ball of about 300,000 stars. In 1974 astronomers beamed a radio message toward it from the Arecibo telescope."
  Messier 22: "A ball of tens of thousands of ancient stars, among the first such clusters ever discovered (1665)."
  Messier 41: "A cluster of about 100 stars just below Sirius, possibly the faintest object noted by Aristotle, around 325 BC."
  Messier 35: "A cluster of a few hundred stars at the feet of the Gemini twins, a misty patch by eye under dark skies."
  Omega Centauri: "The biggest ball of stars in our galaxy, with millions of stars, and possibly the core of a small galaxy the Milky Way swallowed."
  # star patterns
  Big Dipper: "Part of Ursa Major, the Great Bear. The two stars at the end of the bowl point to Polaris, the North Star."
  Cassiopeia: "A vain queen of Greek myth, seated on her throne. It circles Polaris, opposite the Big Dipper."
  Orion: "The Hunter of Greek myth, the most recognizable pattern in the winter sky."
  Scorpius: "In myth, the scorpion that killed Orion. They were placed on opposite sides of the sky, so one sets as the other rises."
  Sagittarius (the Teapot): "The Archer, though its brightest stars make a teapot. The center of our galaxy lies just beyond its spout."
  Cygnus (the Northern Cross): "The Swan, flying down the Milky Way with Deneb as its tail."
  Pegasus (the Great Square): "The winged horse of Greek myth, born from the blood of Medusa when Perseus beheaded her."
  Leo: "The lion Hercules defeated as the first of his twelve labours. Its mane is a backwards question mark."
  Taurus: "The Bull: in myth, Zeus took the form of a white bull. The Pleiades ride on its shoulder."
  Gemini: "The twins Castor and Pollux of Greek myth, protectors of sailors."
  Lyra: "The lyre of Orpheus, whose music could charm even the stones. Small, but easy to find by brilliant Vega."
  Perseus: "The hero who slew Medusa. Its star Algol, the “Demon Star,” fades noticeably every three days."
  Auriga: "The Charioteer, a pentagon of stars led by Capella, overhead on winter evenings."
  Boötes: "The Herdsman, forever following the Great Bear around the pole."
  Andromeda: "A princess of Greek myth, chained to a rock and rescued by Perseus. The Andromeda Galaxy lies within it."
  Canis Major: "The Great Dog, one of Orion's hunting dogs, led by Sirius."
  Summer Triangle: "Three bright stars from three constellations: Vega (Lyra), Deneb (Cygnus) and Altair (Aquila). The Milky Way runs right through it."
  Winter Triangle: "Betelgeuse, Sirius and Procyon: three of the brightest stars, each in a different constellation."
