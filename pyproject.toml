[project]
name = "skytrust"
version = "0.1.0"
description = "An astronomy cloud forecast that tells you how often it's been wrong."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "h5py==3.16.0",
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "skyfield==1.55",
    "streamlit==1.64.0",
]

[dependency-groups]
dev = [
    "astral==3.2",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skytrust"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, DTZ: naive datetimes
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# The app's stylesheet is CSS data inside a Python string; wrapping it hurts readability.
"app/views/theme.py" = ["E501"]
"app/views/skychart.py" = ["E501"]  # SVG markup, like the stylesheet

[tool.ruff.lint.isort]
known-first-party = ["skytrust", "views", "synthetic", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quick loop: `pytest` skips network and slow tests. Everything offline: `make test` (and CI).
addopts = "-m 'not network and not slow and not browser' --strict-markers"
filterwarnings = [
    # Emitted inside skyfield's own search code under NumPy 2.5; not our code, harmless.
    "ignore:Setting the dtype on a NumPy array:DeprecationWarning:skyfield",
]
markers = [
    "network: hits live APIs; run manually with `pytest -m network`",
    "slow: longer-running offline checks (Streamlit AppTest); run by `make test` and CI",
    "browser: needs Playwright + Chromium (opt-in): `uv run --with playwright pytest -m browser`",
]

[tool.coverage.run]
source = ["src/skytrust"]

[tool.mypy]
python_version = "3.12"
files = ["src/skytrust"]
# Third-party libraries without type information (skyfield, plotly, sklearn, ...) are treated
# as untyped rather than failing the check.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
